services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80

      # App settings override
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=InternProjectDb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"

      Redis__Enabled: "true"
      Redis__InstanceName: "EcommerceAPI:"

      Jwt__Key: "${Jwt__Key}"
      AuthSecurity__FingerprintSecret: "${AuthSecurity__FingerprintSecret}"
      AuthSecurity__DeviceBindingSecret: "${AuthSecurity__DeviceBindingSecret}"

      # Stripe — values from project .env (Compose substitutes ${...}); supports Stripe__* or STRIPE_* aliases
      Stripe__SecretKey: "${Stripe__SecretKey:-${STRIPE_SECRET_KEY:-}}"
      Stripe__PublishableKey: "${Stripe__PublishableKey:-${STRIPE_PUBLISHABLE_KEY:-}}"
      Stripe__WebhookSecret: "${Stripe__WebhookSecret:-${STRIPE_WEBHOOK_SECRET:-}}"
    ports:
      - "5169:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: InternProjectDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d InternProjectDb"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ecommerce-network
    restart: unless-stopped

  # Second Postgres for dotnet run on host (DBeaver: localhost:5434 / InternProjectDb_Local)
  db-local:
    image: postgres:16-alpine
    container_name: ecommerce-db-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: InternProjectDb_Local
    ports:
      - "5434:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d InternProjectDb_Local"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ecommerce-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-network
    restart: unless-stopped

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_local_data:
  redis_data: